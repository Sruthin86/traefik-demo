---
version: "3.8"

services:
  jaeger:
    image: jaegertracing/all-in-one:1.57
    environment:
      OTEL_TRACES_SAMPLER: 'always_off'
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.jaeger.rule=Host(`jaeger.localhost`)"
        - "traefik.http.routers.jaeger.entrypoints=web"
        - "traefik.http.routers.jaeger.service=jaeger"
        - "traefik.http.services.jaeger.loadbalancer.server.port=16686"
    networks:
      - traefik_public

  traefik:
    image: traefik:latest
    environment:
      OTEL_PROPAGATORS: jaeger
    command:
       # Add the swarm provider
      - "--providers.swarm.endpoint=unix:///var/run/docker.sock"
      # Exposing docker containers
      # When set to false containers that don't have traefik enabled are removed from routing configuration
      - "--providers.swarm.exposedbydefault=false"
      # Watch for docker events
      - "--providers.swarm.watch=true"
      # Sets the the network for the docker provider
      # Traefik will only discover the services in connected to this network 
      - "--providers.swarm.network=traefik_public"
      # Enable the traefik API
      - "--api.insecure=true"
      # Enable the traefik dashboard
      - "--api.dashboard=true"
      # Entrypoints
      # Enable web entry point and redirect to websecure
      - "--entrypoints.web.address=:80"
      # - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      # - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      # Enable websecure entry point
      - "--entrypoints.websecure.address=:443"
      # Enable log level
      - "--log.level=DEBUG"
      # Enable tracing
      - "--tracing=true"
      #- "--tracing.addinternals"
      - "--tracing.serviceName=traefik"
      - "--tracing.sampleRate=1.0"
      - "--tracing.otlp.http=true"
      - "--tracing.otlp.http.endpoint=http://jaeger:4318/v1/traces"
      - "--tracing.otlp.http.headers.foo=bar"
      #- "--tracing.jaeger=true"
      #- "--tracing.jaeger.samplingServerURL=http://localhost:5778/sampling"
      #- "--tracing.jaeger.samplingType=const"
      #- "--tracing.jaeger.samplingParam=1.0"
      #- "--tracing.jaeger.localAgentHostPort=jaeger:6831"
      #- "--tracing.jaeger.gen128Bit"
      #- "--tracing.jaeger.propagation=jaeger"
      #- "--tracing.jaeger.traceContextHeaderName=uber-trace-id"
      #- "--tracing.jaeger.collector.endpoint=http://jaeger:14268/api/traces?format=jaeger.thrift"
      #- "--tracing.jaeger.collector.user=my-user"
      #- "--tracing.jaeger.collector.password=my-password"
    ports:
      - published: 80
        target: 80
        protocol: tcp
        # host mode is used to bind the port to the host network
        # these ports are accessible from outside the host using ip or DNS entries
        mode: host
      - published: 8080
        target: 8080
        protocol: tcp
        mode: host
      - published: 443
        target: 443
        protocol: tcp
        mode: host"
    volumes:
      # map the docker socker so traefik can monitor the changes in the docker socket
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Add a volume for traefik logs
    deploy:
      mode: global
      placement:
        max_replicas_per_node: 1
      update_config:
        failure_action: rollback
      restart_policy:
        window: 15s
    networks:
      - traefik_public

# create a docker external network so traefik can communicate with other services
networks:
  traefik_public:
    external: true

